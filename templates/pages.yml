# This workflow publishes the reader on GitHub Pages and replaces the logs branch.
# Put it at .github/workflows/pages.yml on the archive repository default branch.
# Set the Pages source to GitHub Actions.
# Pages can expose a private repository. Review the access policy before publication.
#
# Set REJGAU_REF to a full, reviewed commit ID from int19h/rejgau.
# Optional variables: ARCHIVE_PATH, ARCHIVE_BRANCH (archive), LOGS_BRANCH (logs).
# Set LOGS_BRANCH to none to omit Markdown logs.
# The bot dispatches archive-updated when its pages configuration is true.
# The hourly schedule also publishes new archive data.

name: Publish archive

on:
  repository_dispatch:
    types: [archive-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.source }}
      logs: ${{ steps.logs.outcome }}
    # New builds replace pending builds. Deployments finish before another deployment starts.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Require a reviewed renderer revision
        env:
          REJGAU_REF: ${{ vars.REJGAU_REF }}
        run: |
          if [[ ! "$REJGAU_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set REJGAU_REF to a full, reviewed commit ID."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
          path: archive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: int19h/rejgau
          ref: ${{ vars.REJGAU_REF }}
          path: rejgau
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rejgau/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: rejgau
      - run: |
          npm run typecheck
          npm test
        working-directory: rejgau
      - id: revisions
        run: |
          echo "renderer=$(git -C rejgau rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "archive=$(git -C archive rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run build:site -- --archive "../archive/$ARCHIVE_PATH" --out ../site --renderer-revision "$RENDERER_REVISION" --archive-revision "$ARCHIVE_REVISION"
        working-directory: rejgau
        env:
          ARCHIVE_PATH: ${{ vars.ARCHIVE_PATH }}
          RENDERER_REVISION: ${{ steps.revisions.outputs.renderer }}
          ARCHIVE_REVISION: ${{ steps.revisions.outputs.archive }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: source
        if: vars.LOGS_BRANCH != 'none'
        env:
          ARCHIVE_BRANCH: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
        run: echo "source=$ARCHIVE_BRANCH@$(git -C archive rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # A log build failure stops log publication. The reader can still deploy.
      - id: logs
        if: vars.LOGS_BRANCH != 'none'
        continue-on-error: true
        run: npm run build:logs -- --archive "../archive/$ARCHIVE_PATH" --out ../logs --source "$SOURCE" --renderer-revision "$RENDERER_REVISION" --archive-revision "$ARCHIVE_REVISION"
        working-directory: rejgau
        env:
          ARCHIVE_PATH: ${{ vars.ARCHIVE_PATH }}
          SOURCE: ${{ steps.source.outputs.source }}
          RENDERER_REVISION: ${{ steps.revisions.outputs.renderer }}
          ARCHIVE_REVISION: ${{ steps.revisions.outputs.archive }}
      - if: steps.logs.outcome == 'failure'
        run: echo "::warning::The log build failed. The logs branch stays unchanged. The reader still deploys."
      - if: steps.logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: logs
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets Pages write access.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  logs:
    needs: build
    if: vars.LOGS_BRANCH != 'none' && needs.build.outputs.logs == 'success'
    runs-on: ubuntu-latest
    # Only this job can push the generated logs. It runs no package scripts.
    permissions:
      contents: write
    concurrency:
      group: logs-publish
      cancel-in-progress: false
    env:
      LOGS_BRANCH: ${{ vars.LOGS_BRANCH || 'logs' }}
      ARCHIVE_BRANCH: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
      SOURCE: ${{ needs.build.outputs.source }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logs
          path: logs
      - name: Push the logs branch (one commit, replacing the previous one)
        working-directory: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reject archive and default branches before the force push.
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ -z "$LOGS_BRANCH" ] || [ "$LOGS_BRANCH" = "$ARCHIVE_BRANCH" ] || [ "$LOGS_BRANCH" = "$default_branch" ]; then
            echo "::error::LOGS_BRANCH ($LOGS_BRANCH) must not be the archive branch ($ARCHIVE_BRANCH) or the default branch ($default_branch)"
            exit 1
          fi
          git init -q -b "$LOGS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "Render logs from $SOURCE"
          # Skip the push when the generated files match the current branch.
          if git fetch -q --depth=1 origin "$LOGS_BRANCH" 2>/dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "Logs unchanged."
          else
            git push -q --force origin "HEAD:refs/heads/$LOGS_BRANCH"
          fi
