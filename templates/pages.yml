# Publishes a rejgau archive: the reader site on GitHub Pages, and human-readable Markdown logs on
# a branch of their own (default "logs", regenerated as a single commit each time).
#
# Put this file on the archive repo's DEFAULT branch (e.g. main) as .github/workflows/pages.yml,
# and set Settings → Pages → Source to "GitHub Actions". Note that a Pages site is public even
# when the repository is private.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   REJGAU_REF    git ref (ideally a commit SHA) of int19h/rejgau to build with; default: main
#   ARCHIVE_PATH  folder of the archive inside the branch; default: repo root
#   ARCHIVE_BRANCH branch the bot writes to; default: archive
#   LOGS_BRANCH   branch for the rendered logs; default: logs ("none" to skip them)
#
# Runs when the bot signals new commits (repository_dispatch, if "pages": true in its config),
# hourly as a safety net, and on demand.

name: Publish archive

on:
  repository_dispatch:
    types: [archive-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.source }}
      logs: ${{ steps.logs.outcome }}
    # Coalesce bursts of updates; the deploy job below is never cancelled mid-way.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
          path: archive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: int19h/rejgau
          ref: ${{ vars.REJGAU_REF || 'main' }}
          path: rejgau
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rejgau/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: rejgau
      - run: npm run build:site -- --archive "../archive/$ARCHIVE_PATH" --out ../site
        working-directory: rejgau
        env:
          ARCHIVE_PATH: ${{ vars.ARCHIVE_PATH }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: source
        if: vars.LOGS_BRANCH != 'none'
        env:
          ARCHIVE_BRANCH: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
        run: echo "source=$ARCHIVE_BRANCH@$(git -C archive rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # A failure here shouldn't stop the site from deploying: it's reported, and the logs job skipped.
      - id: logs
        if: vars.LOGS_BRANCH != 'none'
        continue-on-error: true
        run: npm run build:logs -- --archive "../archive/$ARCHIVE_PATH" --out ../logs --source "$SOURCE"
        working-directory: rejgau
        env:
          ARCHIVE_PATH: ${{ vars.ARCHIVE_PATH }}
          SOURCE: ${{ steps.source.outputs.source }}
      - if: steps.logs.outcome == 'failure'
        run: echo "::warning::Rendering the logs failed, so the logs branch wasn't updated (the site still deploys)."
      - if: steps.logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: logs
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job gets Pages rights; the build job runs third-party packages.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  logs:
    needs: build
    if: vars.LOGS_BRANCH != 'none' && needs.build.outputs.logs == 'success'
    runs-on: ubuntu-latest
    # Only this job can push, and it runs no third-party packages: just git on the build's output.
    permissions:
      contents: write
    concurrency:
      group: logs-publish
      cancel-in-progress: false
    env:
      LOGS_BRANCH: ${{ vars.LOGS_BRANCH || 'logs' }}
      ARCHIVE_BRANCH: ${{ vars.ARCHIVE_BRANCH || 'archive' }}
      SOURCE: ${{ needs.build.outputs.source }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logs
          path: logs
      - name: Push the logs branch (one commit, replacing the previous one)
        working-directory: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This force-pushes: never over the bot's branch or the default branch.
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ -z "$LOGS_BRANCH" ] || [ "$LOGS_BRANCH" = "$ARCHIVE_BRANCH" ] || [ "$LOGS_BRANCH" = "$default_branch" ]; then
            echo "::error::LOGS_BRANCH ($LOGS_BRANCH) must not be the archive branch ($ARCHIVE_BRANCH) or the default branch ($default_branch)"
            exit 1
          fi
          git init -q -b "$LOGS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "Render logs from $SOURCE"
          # Skip the push when nothing changed (e.g. the hourly run with no new messages).
          if git fetch -q --depth=1 origin "$LOGS_BRANCH" 2>/dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "Logs unchanged."
          else
            git push -q --force origin "HEAD:refs/heads/$LOGS_BRANCH"
          fi
